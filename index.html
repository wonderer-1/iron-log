<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">

<link rel="apple-touch-icon" href="icon-180.png">
<title>Iron Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: phone-sized column, page area scrolls, tab bar fixed at bottom */
:root{
  --bg:#EEF0EC; --card:#FFFFFF; --fg:#16191B; --muted:#6B7270; --line:#D9DDD8;
  --accent:#7B2FD6; --accent-soft:#EEE3FC; --pr:#E2A300; --ok:#1E9E5A;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1214; --card:#1A1E21; --fg:#ECEFEC; --muted:#8E9693; --line:#2A3034;
  --accent:#A97CF5; --accent-soft:#2E1F4A; --pr:#F2B92E; --ok:#3CC47E; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
html,body{overscroll-behavior:none}
html,body{height:100%;margin:0}
body{background:#888;font-family:var(--body);color:var(--fg);display:flex;justify-content:center;align-items:center;font-size:15px}
.phone{width:min(100vw,400px);height:min(100vh,820px);background:var(--bg);border-radius:28px;overflow:hidden;display:flex;flex-direction:row;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.35)}
@media (max-width:440px){body{background:var(--bg)}.phone{border-radius:0;height:100%;box-shadow:none}}
main{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
h1{font-family:var(--display);font-weight:800;font-size:34px;margin:0 0 4px;letter-spacing:.5px;text-transform:uppercase}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:22px 0 10px;text-transform:uppercase;letter-spacing:1px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border-radius:16px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
.sample{display:inline-block;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;background:var(--pr);color:#16191B;padding:2px 8px;border-radius:99px;margin-bottom:12px}

/* tab bar */
/* floating pill menu, detached from the edge, over the content */
nav{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;display:flex;gap:4px;padding:6px;border-radius:32px;
  background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 8px 28px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.08)}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;width:66px;padding:9px 0 7px;border-radius:24px;transition:background .2s,color .2s;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent);background:var(--accent-soft)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){nav button{transition:none}}

/* home */
.streak{display:flex;align-items:center;gap:14px}
.streak .num{font-size:64px;line-height:.9;color:var(--accent)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--line))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--line))}
.heat i.l3{background:var(--accent)}
.heat i.today{outline:2px solid var(--fg);outline-offset:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats .card{padding:12px}
.stats .num{font-size:26px}
.stats small{color:var(--muted);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* plan */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.days button{border:0;background:var(--card);border-radius:10px;padding:8px 0;font-weight:600;font-size:13px}
.days button small{display:block;font-size:10px;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.days button.on{background:var(--accent);color:#fff}
.days button.on small{color:#fff}
.exrow{display:flex;align-items:center;gap:12px}
.exrow canvas{flex:none;background:var(--bg);border-radius:12px}
.exrow .info{flex:1;min-width:0}
.exrow b{display:block;font-weight:600}
.exrow span{color:var(--muted);font-size:13px}
.x{border:0;background:none;color:var(--muted);font-size:22px;padding:4px 8px}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lib button{border:0;background:var(--card);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600}
.lib canvas{background:var(--bg);border-radius:10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:none;border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:12px;font-weight:600;width:100%}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}

/* sport */
.sport .exrow{align-items:flex-start}
.lcol{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.rest{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;width:72px;padding:6px 0;font:600 14px var(--body);font-variant-numeric:tabular-nums}
.rest.on{background:var(--accent);color:#fff}
.last{font-size:13px;color:var(--muted)}
.ctl{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.ctl label .num{font-size:20px;color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent)}
.kg{display:flex;align-items:center;gap:8px}
.kg button{border:0;background:var(--bg);border-radius:10px;width:40px;height:36px;font-size:18px;font-weight:600}
.kg .num{font-size:22px;flex:1;text-align:center}
.save{border:0;background:var(--ok);color:#fff;border-radius:10px;height:36px;width:44px;font-size:18px;font-weight:700}
.sets{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sets em{font-style:normal;font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px;font-variant-numeric:tabular-nums}
.sets em.pr{background:var(--pr);color:#16191B}
.timer{font-size:28px}

/* profile */
.field{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border:0}
.field input{font:inherit;color:var(--fg);background:none;border:0;text-align:right;width:55%}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.seeall{border:0;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;margin-left:auto;align-self:flex-start}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:0;margin-bottom:10px}
.month h3{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:1px;margin:0 0 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal b{font-size:10px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase}
.cal button{aspect-ratio:1;border:0;border-radius:8px;background:var(--bg);font-size:12px;font-variant-numeric:tabular-nums;padding:0}
.cal button.l1{background:color-mix(in srgb,var(--accent) 35%,var(--line))}
.cal button.l2{background:color-mix(in srgb,var(--accent) 65%,var(--line));color:#fff}
.cal button.l3{background:var(--accent);color:#fff}
.cal button.today{outline:2px solid var(--fg);outline-offset:-2px}
.cal button.sel{outline:3px solid var(--pr);outline-offset:-3px}
.cal button:disabled{opacity:.35;cursor:default}
/* hide scroll bars, scrolling still works */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
.onb{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding-top:10px}
.onb canvas{background:var(--card);border-radius:50%}
.onb .card{width:100%;text-align:left}
.onb .chips{justify-content:center;flex-wrap:wrap;overflow:visible;margin:0}
[hidden]{display:none!important}
</style>
</head>

// ---------- stickman renderer: one loop draws every canvas on screen ----------
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function stick(id,size){const c=document.createElement('canvas');const d=devicePixelRatio||1;c.width=c.height=size*d;c.style.width=c.style.height=size+'px';c.dataset.ex=id;return c}
function lerp(a,b,s){return [a[0]+(b[0]-a[0])*s,a[1]+(b[1]-a[1])*s]}
function draw(c,t){
  const ex=EX[c.dataset.ex];if(!ex)return;
  const ctx=c.getContext('2d'),W=c.width,k=W/116;
  const cs=getComputedStyle(document.documentElement);
  const fg=cs.getPropertyValue('--fg').trim(),ac=cs.getPropertyValue('--accent').trim(),mu=cs.getPropertyValue('--line').trim();
  const s=reduce?.35:(1-Math.cos(t/1600*Math.PI*2))/2;
  const p={};for(const key of ['h','n','hp','k','f','e','w','k2','f2','e2','w2']){const a=ex.A[key]||ex.A[key[0]],b=ex.B[key]||ex.B[key[0]];p[key]=lerp(a,b,s)}
  const X=v=>(v[0]+8)*k,Y=v=>(v[1]+8)*k;
  ctx.clearRect(0,0,W,W);ctx.lineCap=ctx.lineJoin='round';
  const line=(pts,col,w)=>{ctx.strokeStyle=col;ctx.lineWidth=w*k;ctx.beginPath();pts.forEach((v,i)=>i?ctx.lineTo(X(v),Y(v)):ctx.moveTo(X(v),Y(v)));ctx.stroke()};
  line([[-4,92],[104,92]],mu,2);
  const pr=ex.prop||'';
  if(pr.includes('bench')){ctx.fillStyle=mu;ctx.fillRect(X([14,66]),Y([14,66]),66*k,5*k);ctx.fillRect(X([20,70]),Y([20,70]),3*k,22*k);ctx.fillRect(X([70,70]),Y([70,70]),3*k,22*k)}
  if(pr.includes('pullbar'))line([[22,6],[78,6]],mu,3);
  if(pr.includes('wall'))line([[28,-6],[28,92]],mu,3);
  if(pr.includes('lowbar'))line([[62,50],[92,50]],mu,3);
  if(pr.includes('cable')&&ex.cp)line([ex.cp,p.w],mu,1.5);
  if(pr.includes('cable')&&ex.cp2)line([ex.cp2,p.w2],mu,1.5);
  if(pr.includes('bike')){ctx.strokeStyle=mu;ctx.lineWidth=2.5*k;for(const c of [[26,80],[78,80]]){ctx.beginPath();ctx.arc(X(c),Y(c),12*k,0,7);ctx.stroke()}
    line([[26,80],[44,56],[52,80],[26,80]],mu,2.5);line([[44,56],[70,46],[78,80]],mu,2.5)}
  if(pr.includes('box')){ctx.fillStyle=mu;ctx.fillRect(X([8,66]),Y([8,66]),26*k,26*k)}
  if(pr.includes('seat')){ctx.fillStyle=mu;ctx.fillRect(X([34,64]),Y([34,64]),26*k,4*k);ctx.fillRect(X([45,64]),Y([45,64]),3*k,28*k)}
  if(pr.includes('dipbar'))line([[38,50],[66,50]],mu,3);
  if(pr.includes('smith')){line([[18,-4],[18,92]],mu,2);line([[84,-4],[84,92]],mu,2)}
  if(pr.includes('stack')){line([[90,0],[90,92]],mu,2);line([[104,0],[104,92]],mu,2);line([[90,0],[104,0]],mu,2);
    ctx.fillStyle=mu;for(let i=0;i<5;i++)ctx.fillRect(X([92,0]),Y([0,70+i*4.4]),10*k,3*k);ctx.fillStyle=ac;ctx.fillRect(X([92,0]),Y([0,65.6]),10*k,3*k)}
  const back=fg+'66';
  line([p.hp,p.k2,p.f2],back,5);line([p.n,p.e2,p.w2],back,5);
  line([p.n,p.hp],fg,6);line([p.hp,p.k,p.f],fg,5);line([p.n,p.e,p.w],fg,5);
  ctx.fillStyle=fg;ctx.beginPath();ctx.arc(X(p.h),Y(p.h),7*k,0,7);ctx.fill();
  if(/(^| )bar( |$)/.test(pr)){
    if(ex.A.w2){line([[p.w[0]-14,p.w[1]],[p.w2[0]+14,p.w2[1]]],ac,3)}
    else{ctx.fillStyle=ac;ctx.beginPath();ctx.arc(X(p.w),Y(p.w),8*k,0,7);ctx.fill()}
  }
  if(pr.includes('db')){ctx.fillStyle=ac;for(const w of [p.w,p.w2])ctx.fillRect(X(w)-4*k,Y(w)-3*k,8*k,6*k)}
}

function bestStreak(){const keys=Object.keys(S.days).sort();if(!keys.length)return 0;

function historyView(){
  const keys=Object.keys(S.days).sort(),now=new Date();

  const months=[];for(let y=now.getFullYear(),m=now.getMonth();y>first.getFullYear()||(y===first.getFullYear()&&m>=first.getMonth());m--){if(m<0){m=11;y--}months.push([y,m])}
  const loc=S.lang==='fr'?'fr-FR':'en-GB';
  const cal=([y,m])=>{const off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();let c=t('days').map(d=>`<b>${d.slice(0,1)}</b>`).join('')+'<span></span>'.repeat(off);
    for(let d=1;d<=n;d++){const dt=new Date(y,m,d,12),k=iso(dt),sets=(S.days[k]||[]).length;
      c+=`<button data-hd="${k}" class="${sets>14?'l3':sets>8?'l2':sets?'l1':''}${k===today()?' today':''}${k===histDay?' sel':''}" ${dt>now?'disabled':''} aria-label="${k}">${d}</button>`}
    return `<div class="card month"><h3>${new Date(y,m,1).toLocaleDateString(loc,{month:'long',year:'numeric'})}</h3><div class="cal">${c}</div></div>`};

  if(histDay){const log=S.days[histDay]||[],by={};log.forEach(s=>(by[s.ex]=by[s.ex]||[]).push(s));
    const title=new Date(histDay+'T12:00').toLocaleDateString(loc,{weekday:'long',day:'numeric',month:'long'});
    detail=`<b style="text-transform:capitalize">${title}</b>`+(log.length?Object.entries(by).map(([ex,ss])=>`<div class="row"><span>${exn(ex)}</span><span class="last">${ss.length} × · ${fmt(ex,ss[ss.length-1])}</span></div>`).join(''):`<span class="sub" style="margin:0">${t('noworkout')}</span>`)}
  return `<button class="back" data-histback>${t('backhome')}</button><h1>${t('history')}</h1>

function render(){
  document.documentElement.lang=S.lang;
  $('#tabs').hidden=!S.onboarded;
  $('#page').innerHTML=S.onboarded?PAGES[page]():onboard();
  document.querySelectorAll('[data-c]').forEach(el=>el.replaceWith(stick(el.dataset.c,+el.dataset.s)));
  document.querySelectorAll('#tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.p===page);b.lastChild.textContent=t(b.dataset.p)});
}
setInterval(()=>{const c=$('#clock');if(c&&startT){const s=Math.floor((Date.now()-startT)/1000);c.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  if(restI!==null){const left=Math.ceil((restEnd-Date.now())/1000),b=$('#rt'+restI),it=S.plan[sportDay].items[restI];
    if(left<=0){if(b){b.classList.remove('on');b.textContent='⏱ '+mmss(RST(it||{}))}restI=null;if(!NAT&&navigator.vibrate)navigator.vibrate(BZZ);toast(t('restdone'))}
    else if(b)b.textContent='⏱ '+mmss(left)}},1000);

// ---------- events ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const D=b.dataset;
  if(D.p){page=D.p;adding=false;history=false;creating=false;if(page==='sport')sportDay=dow();render();$('#page').scrollTop=0;return}
  if(D.go){page=D.go;render();return}
  if('hist' in D){history=true;histDay=today();render();$('#page').scrollTop=0;return}
  if('histback' in D){history=false;render();return}
  if(D.hd){histDay=D.hd;render();return}
  if(D.goal){S.profile.goal=t('g_'+D.goal);save();render();return}
  if('onbdone' in D){if(!(S.profile.name||'').trim()){$('#ob-name').focus();toast(t('needyou'));return}S.onboarded=true;page='home';save();render();return}
  if('redo' in D){S.onboarded=false;save();render();return}
  if(D.lang){S.lang=D.lang;save();render()}
  if(D.day){planDay=+D.day;render()}
  if('adding' in D){adding=true;render()}
  if('done' in D){adding=false;render()}
  if(D.f){filter=D.f;render()}
  if('newex' in D){creating=true;render()}
  if('cancel' in D){creating=false;render()}
  if('create' in D){const n=$('#cx-name').value.trim();if(!n){$('#cx-name').focus();toast(t('needname'));return}
    const id='c'+Date.now();S.custom[id]={n,g:$('#cx-group').value,m:$('#cx-track').value,like:$('#cx-like').value};regCustom(id,S.custom[id]);
    const p=S.plan[planDay];p.items.push(newItem(id));if(p.label==='Rest')p.label='Workout';
    save();creating=false;adding=false;render();toast(n+' '+t('addedto')+' '+DAYS_()[planDay])}
  if(D.add){const p=S.plan[planDay];p.items.push(newItem(D.add));if(p.label==='Rest')p.label='Workout';save();toast(exn(D.add)+' '+t('addedto')+' '+DAYS_()[planDay])}
  if(D.del){S.plan[planDay].items.splice(+D.del,1);save();render()}
  if(D.ss){const [i,v]=D.ss.split('|');const it=S.plan[planDay].items[i];it.sets=Math.max(1,it.sets+ +v);save();render()}
  if(D.rr){const [i,v]=D.rr.split('|');const it=S.plan[planDay].items[i];it.reps=Math.max(1,it.reps+ +v);save();render()}
  if(D.rt){const [i,v]=D.rt.split('|');const it=S.plan[planDay].items[i];it.rest=Math.max(0,Math.min(600,RST(it)+ +v));save();render()}
  if(D.sd){sportDay=+D.sd;restStop();render()}
  if(D.rest){const i=+D.rest;if(restI===i)restStop();else restGo(i);render()}
  if(D.st){const [id,v]=D.st.split('|');const el=$('#'+id);el.textContent=Math.round(Math.max(0,+el.textContent+ +v)*10)/10;
    const pl=$('#pl'+id.slice(1));if(id[0]==='w'&&pl)pl.textContent=plates(+el.textContent)}
  if(D.pin){S.pin[D.pin]=!PIN(D.pin);save();render()}
  if(D.save){const i=D.save,it=S.plan[sportDay].items[i],m=M(it.ex),num=id=>+$('#'+id).textContent;
    const w=m==='kg'||m==='km'?num('w'+i):0,r=m==='sec'?num('w'+i):m==='km'?num('m'+i):+$('#r'+i).value;
    // what counts as a record: heavier (then more reps) for kg, farther for km, more reps or seconds otherwise
    const val=s=>m==='kg'?s.w*1000+s.r:m==='km'?s.w:s.r;
    const p=PIN(it.ex)?1:0;
    const prev=Object.values(S.days).flat().filter(s=>s.ex===it.ex&&!s.p===!p);const pr=val({w,r})>0&&(m!=='kg'||w>0)&&prev.every(s=>val(s)<val({w,r}));
    const set=p?{w,r,p}:{w,r};(S.days[today()]=S.days[today()]||[]).push({ex:it.ex,...set,pr});S.last[it.ex]=set;if(RST(it))restGo(+i);save();render();toast(pr?t('pr')+' '+fmt(it.ex,set):t('saved'))}
  if('reset' in D){if(b.dataset.armed){S={v:3,lang:S.lang,side:S.side,custom:{},profile:{name:'',bw:'',height:'',goal:''},plan:DAYS.map(()=>({label:'Rest',items:[]})),last:{},days:{}};save();render();toast(t('cleared'))}
    else{b.dataset.armed=1;b.textContent=t('confirm');b.style.background='#D93636';b.style.color='#fff'}}
});
document.addEventListener('input',e=>{const tg=e.target;
  if(tg.id==='cx-like'){const c=document.querySelector('#page canvas[data-ex]');if(c)c.dataset.ex=tg.value}
  if(tg.type==='range')$('#rv'+tg.dataset.i).textContent=tg.value;
  if(tg.id==='lbl'){S.plan[planDay].label=tg.value;save()}
  if(tg.dataset.pf){S.profile[tg.dataset.pf]=tg.value;save()}
});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script>
</body>
